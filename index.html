<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b4f">
<meta name="description" content="Personal finance tracker in UGX. All data stays on your phone.">
<title>Ssente</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top"><h1 id="title">Ssente</h1><div id="monthSwitch" class="month-switch" hidden>
  <button class="icon-btn" data-act="prevMonth" aria-label="Previous month">‹</button>
  <span id="monthLabel"></span>
  <button class="icon-btn" data-act="nextMonth" aria-label="Next month">›</button></div></header>
<main id="view"></main>
<button id="fab" class="fab" data-act="addExpense" aria-label="Add expense">+</button>
<nav class="tabs">
  <button data-tab="home" class="on"><span>🏠</span>Home</button>
  <button data-tab="month"><span>📅</span>Month</button>
  <button data-tab="goals"><span>🎯</span>Goals</button>
  <button data-tab="school"><span>🎓</span>School</button>
  <button data-tab="more"><span>⚙️</span>More</button>
</nav>
<dialog id="sheet"><form id="sheetForm" method="dialog"></form></dialog>
<script src="js/money.js"></script>
<script src="js/store.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
